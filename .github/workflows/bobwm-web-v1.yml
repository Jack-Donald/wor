# bobwm-web-v1（bobwm）独立采集/维护 workflow 模板（A03/A04/B02 整改轮语义）。
# 用法：复制到执行仓库 .github/workflows/（受保护分支、经维护者审定后启用）；
# 配置文件放执行仓库 config/bobwm-web-v1.run.json（wealth-observer-p4-run/v1，无秘密）；
# run 块以 $GITHUB_WORKSPACE 拼接其绝对路径传入 --config（CLI requireAbsolute
# 拒绝相对路径——相对形态会使首个真实运行 exit 1）。
# Secret（名称 only，值由执行仓库维护者录入）：P4_HTTPS_BEARER（签名 JWT）与 P4_HTTPS_API_KEY（Supabase 网关密钥）；
# 仅 --write 需要；psql 容器/原生主机通道改用运行环境提供凭据，不经本文件）。
# 独立调度：本文件只调度 bobwm 一个来源；没有总任务/矩阵调所有源。
# 手动 dispatch：默认 --local-only（保存本地包，不写目标）；写入置 write=true
# （write=true 时 CLI 按目标类型自行要求凭据，dispatch 语义与 B02 整改前不变）。
# 定时任务（B02 整改）：schedule 分支由执行仓库配置文件
# config/bobwm-web-v1.schedule.json 驱动，字段：{"enabled": boolean, "mode": "write"|"local-only"}
# - 默认关闭：文件缺失、enabled 不为 true 或 JSON 解析失败 → 输出跳过原因（含
#   collectorId 与原因）并 exit 0，不执行任何 CLI 命令（不请求来源、不写库）；
# - enabled=true 且 mode=write → 先核对 config/bobwm-web-v1.run.json 的 target.type：
#   https 目标要求 Secret P4_HTTPS_BEARER 非空，缺失则明确 exit 1（不静默降级
#   local-only）；psql 目标凭据由运行环境提供、跳过该前置检查；通过后执行
#   collect --mode daily --write；
# - enabled=true 且 mode=local-only → 执行 collect --mode daily --local-only（显式
#   配置的定时只保存本地包，不写目标）；
# - mode 为其他值 → 明确 exit 1，不猜默认。
# 本模板不预设任何真实 cron 启用：cron 为错峰示例窗口（UTC），正式启用（含
# schedule.json 放行与 Secret 配置）由执行仓库维护者按运维流程显式操作。
# 公开 runner 只输出 CLI 安全摘要；不配置 upload-artifact（真实本地包不上传）。
name: collector-bobwm

on:
  workflow_dispatch:
    inputs:
      command:
        description: '执行命令（该源能力范围内）'
        type: choice
        default: collect
        options:
          - collect
          - catalog
          - evaluate
      write:
        description: '写入目标（false=--local-only 仅保存本地包；true 需 Secrets 已配置）'
        type: boolean
        default: false
  schedule:
    # UTC；错峰示例窗口，正式时间由执行仓库维护者按站点窗口/礼貌间隔证据核定后调整。
    - cron: '33 2 * * *'
permissions:
  # 最小权限：只读仓库内容；无 pull-requests/packages/id-token 等额外授权。
  contents: read

concurrency:
  # 同源任务串行且不互相取消（礼貌间隔与请求预算按任务维度生效，防止重叠突破预算）。
  group: collector-bobwm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest
    # 作业级时限（A03 整改）：GitHub Actions 只认 jobs.<job_id>.timeout-minutes；
    # 此前写在 YAML 顶层属无效键。上限 30 分钟，与并发串行共同限制单次运行面。
    timeout-minutes: 30
    steps:
      - name: 检出执行仓库（固定 SHA）
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 安装 Node.js（固定 SHA）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: 执行编排命令（安全摘要输出）
        env:
          # Secrets 只经环境注入；缺失时 CLI 走 --local-only/离线路径，不报凭据错误。
          P4_HTTPS_BEARER: ${{ secrets.P4_HTTPS_BEARER }}
          P4_HTTPS_API_KEY: ${{ secrets.P4_HTTPS_API_KEY }}
          P4_HTTPS_SCHEMA: wo_rpc
        run: |
          set -euo pipefail
          # 命令解析（A04 分流＋B02 配置驱动）：schedule 事件不携带 dispatch inputs
          # （inputs.command 展开为空），必须显式分流——schedule 固定执行模板生成时
          # 注入的默认命令 'collect'，启用与写入模式由执行仓库
          # config/bobwm-web-v1.schedule.json 决定（详见模板头注释）；dispatch 保留
          # 人工 inputs（command choice＋write boolean）原语义，write=true 时 CLI 按
          # 目标类型自行要求凭据。
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            COMMAND='collect'
            # B02：以 node 解析 schedule 配置（runner 必有 node），单行输出判定协议
            # （"MODE --write"|"MODE --local-only"|"SKIP <id>：<原因>"|"ERROR <id>：<原因>"）；
            # node 自身恒 exit 0，一切结果经协议行表达——意外空输出落入 case 的 *) 分支
            # fail-closed（exit 1，不猜默认、不静默写库）。
            VERDICT="$(node -e '
              const fs = require("node:fs")
              // 判定函数：读 schedule.json 与 run.json，返回单行判定协议串（见上方说明）。
              function verdict() {
                const sp = process.argv[1]
                const rp = process.argv[2]
                const id = "bobwm-web-v1"
                if (!fs.existsSync(sp)) {
                  return "SKIP " + id + "：schedule 配置文件缺失（默认关闭，未执行任何 CLI/来源请求）：" + sp
                }
                let s
                try { s = JSON.parse(fs.readFileSync(sp, "utf8")) } catch (e) {
                  return "SKIP " + id + "：schedule 配置 JSON 解析失败，按未启用处理（不写库）：" + sp + "：" + String(e && e.message || e)
                }
                if (s === null || typeof s !== "object" || s.enabled !== true) {
                  return "SKIP " + id + "：定时任务未启用（enabled!=true，当前 enabled=" + JSON.stringify(s && s.enabled) + "），默认关闭"
                }
                const m = s.mode
                if (m !== "write" && m !== "local-only") {
                  return "ERROR " + id + "：schedule.mode 非法：" + JSON.stringify(m) + "（只允许 write 或 local-only），拒绝猜测默认"
                }
                if (m === "write") {
                  let r
                  try { r = JSON.parse(fs.readFileSync(rp, "utf8")) } catch (e) {
                    return "ERROR " + id + "：读取运行配置失败，无法核对写入凭据前提：" + rp + "：" + String(e && e.message || e)
                  }
                  const t = r && r.target && r.target.type
                  if (t === "https") {
                    if (!process.env.P4_HTTPS_BEARER) {
                      return "ERROR " + id + "：schedule mode=write 且 target.type=https，但环境变量 P4_HTTPS_BEARER 为空：请先在执行仓库录入 Secret P4_HTTPS_BEARER 再启用（不降级 local-only）"
                    }
                    if (!process.env.P4_HTTPS_API_KEY) {
                      return "ERROR " + id + "：schedule mode=write 且 target.type=https，但环境变量 P4_HTTPS_API_KEY 为空：请先在执行仓库录入 Secret P4_HTTPS_API_KEY 再启用（不降级 local-only）"
                    }
                  } else if (t !== "psql") {
                    return "ERROR " + id + "：运行配置 target.type 非法：" + JSON.stringify(t) + "（只允许 psql 或 https）"
                  }
                }
                return "MODE " + (m === "write" ? "--write" : "--local-only")
              }
              console.log(verdict())
            ' "$GITHUB_WORKSPACE/config/bobwm-web-v1.schedule.json" "$GITHUB_WORKSPACE/config/bobwm-web-v1.run.json")"
            case "$VERDICT" in
              'MODE --write')
                MODE='--write'
                ;;
              'MODE --local-only')
                MODE='--local-only'
                ;;
              SKIP*)
                # 默认关闭：明确输出跳过原因（含 collectorId 与原因）并 exit 0，
                # 不执行任何 CLI 命令（不请求来源）。
                printf '%s\n' "$VERDICT"
                exit 0
                ;;
              *)
                # 明确失败（mode 非法、写入凭据缺失、run.json 不可读等）：
                # 不猜默认、不静默降级 local-only。
                printf '%s\n' "$VERDICT" >&2
                exit 1
                ;;
            esac
          else
            COMMAND="${{ inputs.command }}"
            MODE='--local-only'
            if [ "${{ inputs.write }}" = 'true' ] && [ "$COMMAND" = 'collect' ]; then
              MODE='--write'
            fi
          fi
          # 非 collect 命令的写入档统一由各命令自身 --preview/--apply 语义控制：
          # 模板默认 preview（不写目标）；实际应用由执行仓库维护者按运维流程执行。
          case "$COMMAND" in
            collect)
              node dist/bobwm-web-v1/orchestrator.mjs collect \
                --config "$GITHUB_WORKSPACE/config/bobwm-web-v1.run.json" --mode daily "$MODE"
              ;;
            catalog)
              node dist/bobwm-web-v1/orchestrator.mjs catalog \
                --config "$GITHUB_WORKSPACE/config/bobwm-web-v1.run.json" --preview
              ;;
            evaluate)
              node dist/bobwm-web-v1/orchestrator.mjs evaluate \
                --config "$GITHUB_WORKSPACE/config/bobwm-web-v1.run.json" --preview
              ;;
            *)
              echo "未支持的命令：$COMMAND（事件：${{ github.event_name }}）" >&2
              exit 1
              ;;
          esac
      # 故障可见性：仅输出安全摘要（CLI 自身设计）；无 artifact 上传、无密钥回显。
